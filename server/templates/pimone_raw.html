<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pimone</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: monospace; padding: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 6px 12px; text-align: left; }
        th { background-color: #eee; }
        .gauge-label { text-align: center; font-size: 0.9em; }

        .toggle-btn {
            padding: 4px 10px;
            margin-right: 6px;
            border: 1px solid #ccc;
            background: #f5f5f5;
            cursor: pointer;
        }
        .toggle-btn.active {
            background: #4285f4;
            color: white;
            border-color: #4285f4;
        }

        /* lock chart height so it stops growing */
        #main-chart {
            width: 100% !important;
            height: 300px !important;
        }
    </style>
</head>
<body>

<h1>pimone</h1>

<!-- TOP: window buttons + full-width chart -->
<div style="max-width: 100%; margin-bottom: 6px;">
    <div style="margin-bottom: 4px;">
        <button class="toggle-btn active" data-window="300"  onclick="setChartWindow(300,  this)">5m</button>
        <button class="toggle-btn"        data-window="600"  onclick="setChartWindow(600,  this)">10m</button>
        <button class="toggle-btn"        data-window="1200" onclick="setChartWindow(1200, this)">20m</button>
        <button class="toggle-btn"        data-window="3600" onclick="setChartWindow(3600, this)">60m</button>
    </div>
    <canvas id="main-chart"></canvas>
</div>

<!-- BOTTOM: left = tables, right = 4 gauges (2x2) -->
<div style="display: flex; gap: 20px; max-width: 100%;">

    <!-- left half: buttons + tables -->
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
        <div style="margin-bottom: 10px;">
            <button id="btn-proc" class="toggle-btn active"
                    onclick="toggleSection('proc-section','btn-proc')">Processes</button>
            <button id="btn-disk" class="toggle-btn active"
                    onclick="toggleSection('disk-section','btn-disk')">Disk</button>
        </div>

        <div id="tables-wrapper" style="flex: 1; display: flex; gap: 20px; min-height: 0;">
            <div id="proc-section" style="flex: 1; min-width: 0; overflow: auto;">
                <table>
                    <thead>
                    <tr><th>PID</th><th>Name</th><th>CPU % (total)</th><th>Mem %</th></tr>
                    </thead>
                    <tbody id="process-rows"></tbody>
                </table>
            </div>
            <div id="disk-section" style="flex: 1; min-width: 0; overflow: auto;">
                <table>
                    <thead>
                    <tr><th>Mount (GB)</th><th>Used</th><th>Total</th></tr>
                    </thead>
                    <tbody id="disk-rows"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- right half: 4 gauges in 2x2 grid -->
    <div style="flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 10px;">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <canvas id="cpu-gauge" style="max-height: 130px;"></canvas>
            <div class="gauge-label" id="cpu-gauge-label">CPU: --%</div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <canvas id="mem-gauge" style="max-height: 130px;"></canvas>
            <div class="gauge-label" id="mem-gauge-label">Mem: -- GB</div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <canvas id="disk-gauge" style="max-height: 130px;"></canvas>
            <div class="gauge-label" id="disk-gauge-label">Disk /: --%</div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <canvas id="topproc-gauge" style="max-height: 130px;"></canvas>
            <div class="gauge-label" id="topproc-gauge-label">Top proc: --%</div>
        </div>
    </div>

</div>

<script src="{{ url_for('static', filename='pimone.js') }}"></script>

</body>
</html>
